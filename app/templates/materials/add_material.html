{% extends "base.html" %}

{% block title %}Добавить материал в «{{ lesson.title }}»{% endblock %}

{% block content %}
<h1>Добавить материал в «{{ lesson.title }}»</h1>

{% if materials %}
<form method="POST">
    <select name="material_id">
        {% for material in materials %}
        <option value="{{ material.id }}">{{ material.title }}</option>
        {% endfor %}
    </select>
    <button type="submit">Добавить</button>
</form>
{% else %}
<p>Нет материалов для добавления. <a href="{{ url_for('materials.material_create') }}">Создать новый материал</a></p>
{% endif %}

<a href="{{ url_for('materials.lesson_detail', id=lesson.id) }}">&larr; Назад к уроку</a>
{% endblock %}
